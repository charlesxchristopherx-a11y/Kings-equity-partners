<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Light background version for light mode pages -->
  <rect width="120" height="120" rx="16" fill="#f5f5f0"/>
  <!-- K in charcoal block -->
  <text x="22" y="88" font-family="Arial Black, sans-serif" font-size="58" font-weight="900" fill="#2d3436" letter-spacing="-3">K</text>
  <!-- E -->
  <text x="56" y="88" font-family="Arial Black, sans-serif" font-size="58" font-weight="900" fill="#2d3436" letter-spacing="-3">E</text>
  <!-- P -->
  <text x="90" y="88" font-family="Arial Black, sans-serif" font-size="58" font-weight="900" fill="#2d3436" letter-spacing="-3">P</text>
  <!-- Gold outline stroke around each letter -->
  <rect x="14" y="34" width="18" height="60" rx="3" fill="none" stroke="#c9a84c" stroke-width="2.5"/>
  <rect x="48" y="34" width="18" height="60" rx="3" fill="none" stroke="#c9a84c" stroke-width="2.5"/>
  <rect x="82" y="34" width="18" height="60" rx="3" fill="none" stroke="#c9a84c" stroke-width="2.5"/>
</svg>
